[project]
name = "ap-automation"
version = "0.1.0"
description = "Self-learning AP automation POC — non-PO invoice GL coding via RAG, confidence gating, and write-back loop"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.130.0",
    "pytest>=8.2.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ap_automation*"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
